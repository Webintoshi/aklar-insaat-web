name: Quality and immutable Coolify image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: aklar-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aklar_test
  BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
  BETTER_AUTH_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_R2_PUBLIC_URL: https://media.orduaklarinsaat.com
  R2_ACCOUNT_ID: ci-account
  R2_ACCESS_KEY_ID: ci-access
  R2_SECRET_ACCESS_KEY: ci-secret
  R2_BUCKET_NAME: aklar-insaat-web
  IP_HASH_SECRET: ci-ip-hash-secret-at-least-32-characters
  INTERNAL_CRON_SECRET: ci-internal-cron-secret-at-least-32-characters

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aklar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aklar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Check and apply reviewed migrations
        run: |
          npm run db:check
          npm run db:migrate
          npm run db:verify
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/webintoshi/aklar-insaat-web:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_R2_PUBLIC_URL=${{ vars.NEXT_PUBLIC_R2_PUBLIC_URL }}

